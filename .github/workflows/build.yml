name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Shaker.Markdown.Activities.sln

      - name: Build
        run: dotnet build Shaker.Markdown.Activities.sln -c Release --no-restore

      - name: Test
        run: dotnet test Shaker.Markdown.Activities.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/Shaker.Markdown.Activities/Shaker.Markdown.Activities.csproj -c Release -o artifacts --no-build

      # Studio finds an activity's icon by looking up "<ActivityName>Icon", so a renamed activity silently
      # loses its icon. Cheaper to catch here than to notice it in the Activities panel weeks later.
      - name: Verify every activity has an icon
        run: |
          set -euo pipefail
          keys=$(cat src/Shaker.Markdown.Activities.Design/Themes/Icons.xaml \
                     src/Shaker.Markdown.Activities.Windows.Design/Themes/Icons.xaml)
          missing=0

          for activity in $(grep -rhoP 'public sealed class \K\w+(?= : (CodeActivity|MarkdownActivityBase|MarkdownWindowActivity))' \
                            src/Shaker.Markdown.Activities src/Shaker.Markdown.Activities.Windows | sort -u); do
            if grep -q "x:Key=\"${activity}Icon\"" <<<"$keys"; then
              echo "ok      $activity"
            else
              echo "::error::No icon named ${activity}Icon in any Themes/Icons.xaml"
              missing=1
            fi
          done

          exit $missing

      # Packing without the designers is only a warning, and warnings do not fail a build, so the shape of
      # the package is asserted here instead. This layout is load-bearing: a Studio "Windows" project
      # resolves lib/net6.0-windows7.0, so designers that sit only in lib/net6.0 are never loaded, and the
      # activities then land in a folder named after the assembly with no icons.
      - name: Verify package layout
        run: |
          set -euo pipefail
          package=$(ls artifacts/*.nupkg)
          contents=$(unzip -l "$package")
          echo "$contents"

          expect() {
            if ! grep -q "$1" <<<"$contents"; then
              echo "::error::Expected $1 in $package"
              exit 1
            fi
          }

          # Three lib folders: Windows-legacy, Windows, and the frameworkless fallback.
          for tfm in net461 net6.0 net6.0-windows7.0; do
            expect "lib/$tfm/Shaker.Markdown.Activities.dll"
            expect "lib/$tfm/Shaker.Markdown.Core.dll"
          done

          # The WPF half, in the two folders a Studio actually resolves and nowhere else.
          for tfm in net461 net6.0-windows7.0; do
            expect "lib/$tfm/Shaker.Markdown.Activities.Design.dll"
            expect "lib/$tfm/Shaker.Markdown.Activities.Windows.dll"
            expect "lib/$tfm/Shaker.Markdown.Activities.Windows.Design.dll"
            expect "lib/$tfm/Microsoft.Web.WebView2.Core.dll"
            expect "lib/$tfm/Microsoft.Web.WebView2.Wpf.dll"
            expect "lib/$tfm/WebView2Loader.dll"
          done

          # lib/net6.0 is what a cross-platform project and a Linux robot resolve. Nothing WPF may be in it.
          for wpf in Shaker.Markdown.Activities.Design.dll Shaker.Markdown.Activities.Windows.dll \
                     Shaker.Markdown.Activities.Windows.Design.dll Microsoft.Web.WebView2.Core.dll \
                     Microsoft.Web.WebView2.Wpf.dll WebView2Loader.dll; do
            if grep -q "lib/net6.0/$wpf" <<<"$contents"; then
              echo "::error::lib/net6.0 must not carry $wpf; a cross-platform robot cannot load WPF"
              exit 1
            fi
          done

          nuspec=$(unzip -p "$package" "*.nuspec")

          # Studio reads the target framework groups here to decide which project types the package
          # supports, so all three have to be present or it reports the package as incompatible.
          for group in '"'"'targetFramework=".NETFramework4.6.1"'"'"' '"'"'targetFramework="net6.0"'"'"' '"'"'targetFramework="net6.0-windows7.0"'"'"'; do
            if ! grep -q "$group" <<<"$nuspec"; then
              echo "::error::The package manifest is missing the dependency group $group"
              echo "$nuspec"
              exit 1
            fi
          done

          # Studio and the Robot provide the workflow runtime. Depending on it here would install a second
          # copy beside the host's, which breaks loading System.Activities in a Windows project. WebView2 is
          # carried rather than depended on for the same reason a cross-platform project should not have it.
          for unwanted in UiPath.Workflow UiPath.Activities.Api Microsoft.Web.WebView2; do
            if grep -q "id=\"$unwanted\"" <<<"$nuspec"; then
              echo "::error::The package must not depend on $unwanted"
              echo "$nuspec"
              exit 1
            fi
          done

          # Markdig is the one real dependency, and it is declared rather than embedded.
          if ! grep -q "id=\"Markdig\"" <<<"$nuspec"; then
            echo "::error::The package should declare its Markdig dependency"
            echo "$nuspec"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: activity-package
          path: artifacts/*.nupkg
